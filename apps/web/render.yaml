# Render Blueprint for the website (static site). GENERATED by scripts/render-blueprint.mjs —
# edit that script, security-headers.mjs or the tool registry, then run `pnpm render:blueprint`.
# In Render: New → Blueprint → this repo, Blueprint Path `apps/web/render.yaml`.
# (The repo-root render.yaml is the paid processor service; keep it out of this Blueprint.)
services:
  - type: web
    name: expensico-web
    runtime: static
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter web build
    staticPublishPath: ./apps/web/out
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: '0'
      - key: NEXT_PUBLIC_SITE_URL
        value: https://expensico.com
      - key: NEXT_PUBLIC_OPERATOR_COUNTRY
        sync: false
      - key: NEXT_PUBLIC_LEGAL_JURISDICTION
        sync: false
      - key: NEXT_PUBLIC_LEGAL_EFFECTIVE_DATE
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: 'default-src ''self''; script-src ''self'' ''unsafe-inline'' ''wasm-unsafe-eval'' https://static.cloudflareinsights.com; style-src ''self'' ''unsafe-inline'' https:; img-src ''self'' data: blob: https:; font-src ''self'' data: https:; connect-src ''self'' https://cloudflareinsights.com; worker-src ''self'' blob:; frame-src ''self''; media-src ''self'' data: blob:; object-src ''none''; base-uri ''self''; form-action ''self''; frame-ancestors ''none'''
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /pdfjs/*
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400
      - path: /opengraph-image
        name: Content-Type
        value: image/png
      - path: /opengraph-image
        name: Cache-Control
        value: public, max-age=86400
    routes:
      - type: redirect
        source: /privacy
        destination: /privacy-policy
      - type: redirect
        source: /terms-of-service
        destination: /terms
      - type: redirect
        source: /terms-and-conditions
        destination: /terms
      - type: redirect
        source: /blog
        destination: /guides
      - type: redirect
        source: /blog/*
        destination: /guides
      - type: redirect
        source: /faq
        destination: /contact
      - type: redirect
        source: /pdf/pdf-viewer
        destination: /tools/pdf-viewer
      - type: redirect
        source: /developer/json-viewer
        destination: /tools/json-viewer
      - type: redirect
        source: /productivity/percentage-calculator
        destination: /finance/percentage-calculator
      - type: redirect
        source: /developer/text-diff
        destination: /productivity/text-diff
      - type: redirect
        source: /developer/password-generator
        destination: /productivity/password-generator
      - type: redirect
        source: /tools/json-formatter
        destination: /developer/json-formatter
      - type: redirect
        source: /productivity/uuid-generator
        destination: /developer/uuid-generator
      - type: redirect
        source: /productivity/timestamp-converter
        destination: /developer/timestamp-converter
      - type: redirect
        source: /developer/unix-timestamp-converter
        destination: /developer/timestamp-converter
      - type: redirect
        source: /pdf/pdf-to-jpg
        destination: /convert/pdf-to-jpg
      - type: redirect
        source: /pdf/pdf-to-png
        destination: /convert/pdf-to-png
      - type: redirect
        source: /pdf/pdf-to-webp
        destination: /convert/pdf-to-webp
      - type: redirect
        source: /pdf/pdf-to-text
        destination: /convert/pdf-to-text
      - type: redirect
        source: /pdf/pdf-to-html
        destination: /convert/pdf-to-html
      - type: redirect
        source: /pdf/pdf-to-docx
        destination: /convert/pdf-to-docx
      - type: redirect
        source: /pdf/jpg-to-pdf
        destination: /convert/jpg-to-pdf
      - type: redirect
        source: /pdf/png-to-pdf
        destination: /convert/png-to-pdf
